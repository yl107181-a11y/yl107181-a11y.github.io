
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFC 音樂會邀請卡</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f3ed;
      color: #34483e;
      font-family: system-ui, sans-serif;
    }

    main {
      box-sizing: border-box;
      width: min(90%, 480px);
      padding: 36px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 40px #00000012;
    }

    p { line-height: 1.8; }

    a {
      display: block;
      padding: 14px;
      margin-top: 16px;
      background: #526e5d;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>歡迎來到音樂會</h1>

    <p>這是一張具有 NFC 功能的紀念邀請卡。</p>

    <p>
      iPhone：將手機上緣靠近卡片，
      點選出現的通知。
    </p>

    <p>
      Android：開啟 NFC，
      將手機背面靠近卡片。
    </p>

    <p>
      如果無法感應 NFC，
      可以透過下方連結進入公開節目冊。
    </p>

    <a id="concert" hidden>查看音樂會節目冊</a>
    <a id="contact" hidden>聯絡管理者</a>
  </main>

  <script>
    async function initialize() {
      try {
        const response = await fetch("./config.json", {
          cache: "no-store"
        });

        if (!response.ok) throw new Error("Config unavailable");

        const config = await response.json();

        // 驗證外部網址，避免不安全的跳轉協定
        function httpsUrl(value) {
          try {
            const url = new URL(value);
            return url.protocol === "https:" ? url.href : null;
          } catch {
            return null;
          }
        }

        const concert = httpsUrl(config.concertUrl);
        const after = httpsUrl(config.afterUrl);

        if (concert) {
          const link = document.getElementById("concert");
          link.href = concert;
          link.hidden = false;
        }

        const contact = config.contactUrl || "";
        if (/^mailto:[^\s]+$/i.test(contact) ||
            httpsUrl(contact)) {
          const link = document.getElementById("contact");
          link.href = contact;
          link.hidden = false;
        }

        const switchTime = Date.parse(config.switchAt);
        const shouldRedirect =
          config.mode === "redirect" ||
          (
            config.mode === "auto" &&
            Number.isFinite(switchTime) &&
            Date.now() >= switchTime
          );

        // 避免設定成跳轉回自己而形成循環
        if (shouldRedirect && after) {
          const target = new URL(after);
          const current = new URL(location.href);

          if (target.origin !== current.origin ||
              target.pathname !== current.pathname) {
            window.location.replace(after);
          }
        }
      } catch (error) {
        // 設定無法載入時，繼續顯示說明頁面
        console.error("Configuration error:", error);
      }
    }

    initialize();
  </script>
</body>
</html>
